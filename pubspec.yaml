name: shop
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.11.4 
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  dio: ^5.9.0
  flutter_screenutil: ^5.9.3 
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0 
  equatable: ^2.0.5 
  image_picker: ^1.2.4
  speech_to_text: ^7.4.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_logo.png"
  min_sdk_android: 21 
flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/json/
